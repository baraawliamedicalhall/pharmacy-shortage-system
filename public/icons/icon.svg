<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Medical Cross -->
    <rect x="226" y="120" width="60" height="272" rx="16" />
    <rect x="120" y="226" width="272" height="60" rx="16" />
  </g>
  <!-- Shortage indicator badge -->
  <circle cx="370" cy="142" r="46" fill="#ef4444" stroke="#ffffff" stroke-width="8" />
  <text x="370" y="160" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">!</text>
</svg>
